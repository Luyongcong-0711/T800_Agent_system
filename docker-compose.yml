name: agent-system-local

services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      APP_ENV: ${APP_ENV:-development}
      AGENT_SERVER_HOST: 0.0.0.0
      AGENT_SERVER_PORT: 8000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      JOB_WORKER_AUTOSTART: ${JOB_WORKER_AUTOSTART:-true}
      JOB_WORKER_POLL_INTERVAL_SECONDS: ${JOB_WORKER_POLL_INTERVAL_SECONDS:-1.0}
      JOB_WORKER_MAX_JOBS_PER_TICK: ${JOB_WORKER_MAX_JOBS_PER_TICK:-5}
      DEFAULT_USER_ID: ${DEFAULT_USER_ID:-default_user}
      DEFAULT_USER_ROLE: ${DEFAULT_USER_ROLE:-owner}
      DEFAULT_WORKSPACE_ID: ${DEFAULT_WORKSPACE_ID:-default}
      DEFAULT_WORKSPACE_ROLE: ${DEFAULT_WORKSPACE_ROLE:-owner}
      AGENT_MASTER_KEY: ${AGENT_MASTER_KEY:-MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
      OBJECT_STORE_BACKEND: ${OBJECT_STORE_BACKEND:-minio}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_BUCKET: ${MINIO_BUCKET:-agent-system}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-agentadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-agentadmin_password_change_me}
      MINIO_SECURE: "false"
      MILVUS_URI: http://milvus:19530
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_HTTP_URL: http://neo4j:7474
      REDIS_URL: redis://redis:6379/0
      DEFAULT_MODEL_PROVIDER: ${DEFAULT_MODEL_PROVIDER:-openai_compatible}
      DEFAULT_MODEL_NAME: ${DEFAULT_MODEL_NAME:-mimo-v2.5-pro}
      DEFAULT_MODEL_BASE_URL: ${DEFAULT_MODEL_BASE_URL:-https://token-plan-cn.xiaomimimo.com/v1}
      DEFAULT_MODEL_API_KEY_REF: ${DEFAULT_MODEL_API_KEY_REF:-secret_mimo_openai_compatible_key}
      DEFAULT_MODEL_API_KEY: ${DEFAULT_MODEL_API_KEY:-}
      DEFAULT_EMBEDDING_MODEL_NAME: ${DEFAULT_EMBEDDING_MODEL_NAME:-text-embedding-v4}
      DEFAULT_EMBEDDING_BASE_URL: ${DEFAULT_EMBEDDING_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      DEFAULT_EMBEDDING_API_KEY_REF: ${DEFAULT_EMBEDDING_API_KEY_REF:-}
      DEFAULT_EMBEDDING_API_KEY: ${DEFAULT_EMBEDDING_API_KEY:-}
      DEFAULT_EMBEDDING_DIMENSION: ${DEFAULT_EMBEDDING_DIMENSION:-1024}
      DEFAULT_MODEL_CONTEXT_WINDOW_TOKENS: ${DEFAULT_MODEL_CONTEXT_WINDOW_TOKENS:-200000}
      DEFAULT_MODEL_MAX_OUTPUT_TOKENS: ${DEFAULT_MODEL_MAX_OUTPUT_TOKENS:-8192}
      DEFAULT_MODEL_TIMEOUT_MS: ${DEFAULT_MODEL_TIMEOUT_MS:-60000}
      LOCAL_FILE_TOOLS_ENABLED: ${LOCAL_FILE_TOOLS_ENABLED:-true}
      LOCAL_FILE_TOOLS_ROOT: ${LOCAL_FILE_TOOLS_ROOT:-/app/local_workspace}
      P0_ACCEPTANCE_REPORT_PATH: /app/logs/p0_acceptance_report.json
    volumes:
      - ./logs:/app/logs
      - ./local_workspace:/app/local_workspace
    depends_on:
      minio:
        condition: service_healthy
      milvus:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_AGENT_API_BASE_URL: ${NEXT_PUBLIC_AGENT_API_BASE_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_AGENT_API_BASE_URL: ${NEXT_PUBLIC_AGENT_API_BASE_URL:-http://localhost:8000}
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-agentadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-agentadmin_password_change_me}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  milvus:
    image: milvusdb/milvus:v2.5.12
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-agentadmin}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-agentadmin_password_change_me}
      MINIO_USE_SSL: "false"
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - milvus_data:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    command:
      [
        "etcd",
        "--advertise-client-urls=http://127.0.0.1:2379",
        "--listen-client-urls=http://0.0.0.0:2379",
        "--data-dir=/etcd",
      ]
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - etcd_data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  neo4j:
    image: neo4j:5.26-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/agentpassword_change_me}
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "no"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

volumes:
  minio_data:
  etcd_data:
  milvus_data:
  neo4j_data:
  neo4j_logs:
  redis_data:
