[project]
name = "agent-system-backend"
version = "0.1.0"
description = "FastAPI backend for the P0 Agent System."
requires-python = ">=3.13"
dependencies = [
  "cryptography>=42.0.0",
  "fastapi>=0.111.0",
  "httpx>=0.27.0",
  "langchain-community>=0.3.0",
  "langchain-core>=0.3.0",
  "langgraph>=0.2.0",
  "minio>=7.2.0",
  "neo4j>=5.20.0",
  "pydantic>=2.7.0",
  "uvicorn>=0.30.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.5.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
